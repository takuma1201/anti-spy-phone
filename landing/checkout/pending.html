<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お支払いを確認中です — Spy Phone</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--gold:#C8A96E;--gold-dark:#B89858;--btc:#F7931A;--bg:#000;--surface:#111;--surface-2:#1a1a1a;--border:rgba(255,255,255,0.08);--text:#F5F5F7;--text-secondary:#86868B}
    html,body{background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
    nav{position:fixed;top:0;left:0;right:0;z-index:100;height:52px;background:rgba(0,0,0,0.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center}
    .nav-logo{font-size:17px;font-weight:600;letter-spacing:-0.3px;color:var(--text);text-decoration:none}
    .nav-logo span{color:var(--gold)}
    main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 24px 60px}
    .card{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px 40px;text-align:center}
    .icon-wrap{width:80px;height:80px;border-radius:50%;background:rgba(247,147,26,0.12);border:2px solid var(--btc);display:flex;align-items:center;justify-content:center;margin:0 auto 28px}
    .icon-wrap svg{width:36px;height:36px;color:var(--btc);animation:spin 1.6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:26px;font-weight:700;letter-spacing:-0.5px;margin-bottom:12px}
    .subtitle{font-size:15px;color:var(--text-secondary);line-height:1.6;margin-bottom:32px}
    .order-block{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:32px}
    .order-label{font-size:12px;color:var(--text-secondary);letter-spacing:0.06em;text-transform:uppercase}
    .order-num{font-size:20px;font-weight:700;letter-spacing:0.04em;color:var(--gold)}
    .note{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:18px 22px;text-align:left;font-size:13px;color:var(--text-secondary);line-height:1.65;margin-bottom:32px}
    .btn-home{display:block;width:100%;background:var(--gold);color:#000;font-size:15px;font-weight:700;letter-spacing:0.02em;padding:14px 24px;border-radius:12px;text-decoration:none;border:none;cursor:pointer;transition:background 0.2s}
    .btn-home:hover{background:var(--gold-dark)}
    @media (max-width:600px){.card{padding:36px 24px}h1{font-size:22px}.order-block{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body>
  <nav><a href="/" class="nav-logo">Spy<span>Phone</span></a></nav>
  <main>
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
      </div>
      <h1>お支払いを確認中です</h1>
      <p class="subtitle">Bitcoinの支払いを受け付けました。ブロックチェーン上での確定を待っています。</p>
      <div class="order-block">
        <span class="order-label">注文番号</span>
        <span class="order-num" id="order-num">—</span>
      </div>
      <div class="note">
        ネットワークの混雑状況により、確定まで数分〜数十分かかることがあります。確定後、確認メールと発送のご連絡をお送りします。このページを閉じても処理は継続されます。
      </div>
      <a href="/" class="btn-home">ホームに戻る</a>
    </div>
  </main>
  <script>
    var p = new URLSearchParams(location.search);
    var o = p.get('order') || p.get('orderNum');
    if (o) document.getElementById('order-num').textContent = o;
  </script>
</body>
</html>
