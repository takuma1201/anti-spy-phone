<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お支払いがキャンセルされました — Spy Phone</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--gold:#C8A96E;--gold-dark:#B89858;--bg:#000;--surface:#111;--surface-2:#1a1a1a;--border:rgba(255,255,255,0.08);--text:#F5F5F7;--text-secondary:#86868B}
    html,body{background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
    nav{position:fixed;top:0;left:0;right:0;z-index:100;height:52px;background:rgba(0,0,0,0.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center}
    .nav-logo{font-size:17px;font-weight:600;letter-spacing:-0.3px;color:var(--text);text-decoration:none}
    .nav-logo span{color:var(--gold)}
    main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 24px 60px}
    .card{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px 40px;text-align:center}
    .icon-wrap{width:80px;height:80px;border-radius:50%;background:rgba(134,134,139,0.12);border:2px solid var(--text-secondary);display:flex;align-items:center;justify-content:center;margin:0 auto 28px}
    .icon-wrap svg{width:36px;height:36px;color:var(--text-secondary)}
    h1{font-size:26px;font-weight:700;letter-spacing:-0.5px;margin-bottom:12px}
    .subtitle{font-size:15px;color:var(--text-secondary);line-height:1.6;margin-bottom:32px}
    .btn-home{display:block;width:100%;background:var(--gold);color:#000;font-size:15px;font-weight:700;letter-spacing:0.02em;padding:14px 24px;border-radius:12px;text-decoration:none;border:none;cursor:pointer;transition:background 0.2s;margin-bottom:12px}
    .btn-home:hover{background:var(--gold-dark)}
    .btn-ghost{display:block;width:100%;background:transparent;color:var(--text-secondary);font-size:14px;padding:12px 24px;border-radius:12px;text-decoration:none;border:1px solid var(--border)}
    .btn-ghost:hover{color:var(--text)}
    @media (max-width:600px){.card{padding:36px 24px}h1{font-size:22px}}
  </style>
</head>
<body>
  <nav><a href="/" class="nav-logo">Spy<span>Phone</span></a></nav>
  <main>
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      </div>
      <h1>お支払いがキャンセルされました</h1>
      <p class="subtitle">決済は完了していません。カートの内容は保持されています。<br>もう一度お手続きいただけます。</p>
      <a href="/#pricing" class="btn-home">もう一度購入する</a>
      <a href="/" class="btn-ghost">ホームに戻る</a>
    </div>
  </main>
</body>
</html>
